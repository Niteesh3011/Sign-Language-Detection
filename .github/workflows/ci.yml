name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Python syntax
        run: |
          python -m py_compile app.py
          python -m py_compile train_yolo11l.py

      - name: Validate Docker build context files
        run: |
          test -f Dockerfile
          test -f .dockerignore
          test -f requirements.txt
